; Configurações do CorTEA. Todos os campos são opcionais: o que faltar usa o
; padrão definido em gameutil/gamesettings.py.

[jogo]
; Fase em que a sessão começa (a plataforma também pode enviar --phase)
fase_inicial = 1
; Quantos caminhos diferentes o jogador percorre em cada fase
rodadas_por_fase = 2
; Fração do índice de desempenho máximo exigida para avançar de fase
; (abaixo disso o jogador repete a fase). Ex.: 0.6 = 60%
id_minimo_fracao = 0.6
; Tempo máximo de cada rodada, em segundos (0 = sem limite)
tempo_limite_rodada_s = 120

[ajuda]
ajudas_iniciais = 3
ajudas_maximo = 3
; Segundos sem responder até a ajuda visual aparecer
tempo_inatividade_s = 6

[rastreamento]
; Tempo que a mão precisa ficar sobre o quadrado para selecioná-lo
tempo_permanencia_ms = 700
; "palma" (centro da mão) ou "indicador" (ponta do dedo indicador)
ponto_da_mao = palma
; Mostra a imagem da webcam num canto da tela (tecla C liga/desliga)
mostrar_previa = false
; O que a webcam acompanha: "pes" (jogo projetado no chão) ou "maos" (para
; testar na mesa). Também dá para trocar no menu Controles, botão "Detecção".
modo = pes
; Modelo do MediaPipe Pose usado nos pés: 0 (leve) ou 1 (completo)
modelo_pose = 1
; Confiança mínima (0 a 1) do MediaPipe para aceitar um pé
visibilidade_minima_pe = 0.3
; Usa a calibração câmera -> projetor feita na plataforma T-TEA para levar os
; pés até a posição certa no chão. Sem calibração, o mapeamento é simples.
usar_calibracao = true
; A imagem da câmera estava espelhada quando a calibração foi feita? Na
; plataforma o espelho vem ligado por padrão.
calibracao_espelhada = true
; Espelha a imagem da câmera. Também dá para trocar no menu Controles, botão
; "Espelho" (com calibração, o jogo ajusta os pontos sozinho).
espelhar_camera = true

[tela]
; true, false ou auto (auto = tela cheia quando o projetor já foi calibrado
; na plataforma). A opção --janela força janela.
tela_cheia = auto
; Monitor onde o jogo abre (0 = principal). auto = o do projetor guardado na
; calibração, ou o principal.
monitor = auto

[interface]
; Na tela inicial, as letras do título levantam uma a uma, bem devagar.
; Use false para deixar a tela totalmente parada.
inicio_animado = true

[som]
ligado = true
volume = 0.5
